Izuna Login Theme
https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 100
padding-left = 0
background = "kuda_izuna_wp.jpg"
use-background-color = false
background-color = "#1e1e2e"
blur = 0
brightness = 0.0
saturation = 0.0

[LockScreen.Clock]
display = true
position = "center"
align = "center"
format = "hh:mm"
font-family = "Bahnschrift"
font-size = 200
font-weight = 400
color = "#ffffff"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "Futura PT"
font-size = 20
font-weight = 500
color = "#ffffff"
margin-top = -15

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
padding-bottom = 100
text = "Aruju-dono! Press any key!"
font-family = "Futura PT"
font-size = 20
font-weight = 400
display-icon = true
icon = "ninHI2.png"
icon-size = 50
color = "#ffffff"
paint-icon = false
spacing = 0

[LoginScreen]
background = "kuda_izuna_wp.jpg"
use-background-color = false
background-color = "#1e1e2e"
blur = 0
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 0
inactive-border-size = 0
active-border-color = "#89dceb"
inactive-border-color = "#89dceb"

[LoginScreen.LoginArea.Username]
font-family = "Futura PT"
font-size = 24
font-weight = 500
color = "#ffffff"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 200
height = 30
display-icon = false
font-family = "Futura PT"
font-size = 14
icon = "password.svg"
icon-size = 16
content-color = "#2e2e2e"
background-color = "#fce4ec"
background-opacity = 0.8
border-size = 0
border-color = "#f8bbd0"
border-radius-left = 12
border-radius-right = 12
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#fce4ec"
background-opacity = 0.8
active-background-color = "#f8bbd0"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#2e2e2e"
active-content-color = "#1a1a1a"
border-size = 0
border-color = "#89dceb"
border-radius-left = 12
border-radius-right = 12
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "Noto Sans Bold"
font-size = 14
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "Noto Sans Bold"
font-weight = 600
font-size = 16
icon-size = 30
icon = "spinner.svg"
color = "#ffffff"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "Noto Sans Bold"
font-size = 11
font-weight = 400
normal-color = "#ffffff"
warning-color = "#f9e2af"
error-color = "#f38ba8"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 0
margin-right = 0
margin-bottom = 100
margin-left = 0
size = 30
border-radius = 12
spacing = 20
font-family = "Noto Sans Bold"

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = false
button-width = -1
popup-width = 200
background-color = "#fce4ec"
background-opacity = 0.1
active-background-opacity = 1.0
content-color = "#ffffff"
active-content-color = "#2e2e2e"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = false
background-color = "#fce4ec"
background-opacity = 0.1
active-background-opacity = 1.0
content-color = "#ffffff"
active-content-color = "#2e2e2e"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-center"
index = 0
background-color = "#fce4ec"
background-opacity = 0.1
active-background-opacity = 1.0
content-color = "#ffffff"
active-content-color = "#2e2e2e"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#e6d1e8"
background-opacity = 0.15
key-content-color = "#322936"
key-color = "#fce4ec"
key-opacity = 0.8
key-active-background-color = "#dfbdde"
key-active-opacity = 1.0
selection-background-color = "#5f3752"
selection-content-color = "#1e1e2e"
primary-color = "#f092d3"
border-size = 0
border-color = "#89dceb"

[LoginScreen.MenuArea.Popups]
max-height = 230
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = false
margin = 5
background-color = "#e6d1e8"
background-opacity = 0.8
content-color = "#2e2e2e"
active-content-color = "#2e2e2e"
active-option-background-color = "#d9a7c2"
active-option-background-opacity = 0.8
font-family = "Futura PT"
border-size = 0
border-color = "#89dceb"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-center"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#fce4ec"
background-opacity = 0.1
active-background-opacity = 1.0
content-color = "#ffffff"
active-content-color = "#2e2e2e"
border-size = 0
icon = "power.svg"
icon-size = 16

[Tooltips]
enable = true
font-family = "Noto Sans Bold"
font-size = 11
content-color = "#342936"
background-color = "#e6d1e8"
background-opacity = 1.0
border-radius = 12
disable-user = false
disable-login-button = false
